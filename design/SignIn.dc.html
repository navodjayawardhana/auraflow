<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0052ff; } a:hover { color: #0041cc; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; position: relative; overflow: hidden; color: #0f172a;">

  <!-- ── Hero ─────────────────────────────────────────────── -->
  <div style="position: relative; height: 372px; background: linear-gradient(158deg, #0b2f8f 0%, #0052ff 46%, #00a5db 100%); overflow: hidden;">
    <div style="position: absolute; top: -80px; right: -60px; width: 240px; height: 240px; border-radius: 999px; background: radial-gradient(circle, rgba(0,240,255,0.34) 0%, rgba(0,240,255,0) 70%);"></div>
    <div style="position: absolute; bottom: 20px; left: -50px; width: 200px; height: 200px; border-radius: 999px; background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 70%);"></div>
    <svg viewBox="0 0 390 120" preserveAspectRatio="none" style="position: absolute; bottom: 56px; left: 0; width: 390px; height: 120px; opacity: 0.2;">
      <path d="M0 78 H92 L106 46 L120 104 L134 62 L146 78 H390" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>

    <div style="position: relative; padding: 74px 20px 0; display: flex; flex-direction: column; gap: 26px;">
      <!-- mark + wordmark, at the size the brand sheet specifies -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg viewBox="77 37 266 266" style="width: 46px; height: 46px;">
          <path d="M 90 230 C 130 230 155 210 185 100 C 198 50 215 50 228 100 C 242 165 195 195 160 185 C 220 185 245 185 265 240 C 285 280 305 240 330 200" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M 90 230 C 130 230 155 210 185 100 C 198 50 215 50 228 100 C 242 165 195 195 160 185 C 220 185 245 185 265 240 C 285 280 305 240 330 200" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="213" cy="72" r="7" fill="#00f0ff"></circle>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 27px; letter-spacing: -0.5px; line-height: 1;">
            <span style="font-weight: 800; color: #ffffff;">Aura</span><span style="font-weight: 400; color: #7ef9ff;">Flow</span>
          </div>
          <div style="font-size: 10px; font-weight: 600; letter-spacing: 3px; color: rgba(255,255,255,0.6);">WORK WITH YOUR BODY</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 30px; font-weight: 800; color: #ffffff; letter-spacing: -0.7px; line-height: 1.15;">Welcome back</span>
        <span style="font-size: 14px; line-height: 21px; color: rgba(255,255,255,0.76); max-width: 268px; text-wrap: pretty;">Your recovery score is waiting — built from last night's sleep and your resting heart rate.</span>
      </div>
    </div>

    <!-- the sheet's curve, drawn rather than a plain radius -->
    <svg viewBox="0 0 390 44" preserveAspectRatio="none" style="position: absolute; bottom: -1px; left: 0; width: 390px; height: 44px;">
      <path d="M0,18 C104,50 292,-6 390,18 L390,44 L0,44 Z" fill="#ffffff"></path>
    </svg>
  </div>

  <!-- ── Form ─────────────────────────────────────────────── -->
  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 12px; font-weight: 600; color: #475569;">Email</span>
      <div style="min-height: 54px; border-radius: 999px; border: 1px solid #e2e8f0; background: #ffffff; padding: 0 18px 0 8px; display: flex; align-items: center; gap: 11px;">
        <span style="width: 36px; height: 36px; border-radius: 999px; background: #0052ff1a; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;" fill="none" stroke="#0052ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </span>
        <span style="font-size: 15px; color: #0f172a;">navod@icbt.lk</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 12px; font-weight: 600; color: #475569;">Password</span>
      <!-- focused state: the brand border is what the real component animates to -->
      <div style="min-height: 54px; border-radius: 999px; border: 1.5px solid #0052ff; background: #ffffff; padding: 0 18px 0 8px; display: flex; align-items: center; gap: 11px; box-shadow: 0 0 0 4px rgba(0,82,255,0.08);">
        <span style="width: 36px; height: 36px; border-radius: 999px; background: #0083b01a; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;" fill="none" stroke="#0083b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </span>
        <span style="flex-grow: 1; font-size: 17px; letter-spacing: 3px; color: #0f172a;">••••••••</span>
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; flex-shrink: 0;" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
    </div>

    <div style="min-height: 56px; border-radius: 999px; background: linear-gradient(100deg, #0052ff 0%, #00b4db 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0,82,255,0.34); margin-top: 4px;">
      <span style="font-size: 16px; font-weight: 700; color: #ffffff;">Sign in</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 4px;">
      <svg viewBox="0 0 24 24" style="width: 13px; height: 13px;" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span style="font-size: 11px; color: #475569;">Your health data is encrypted and private</span>
    </div>

    <div style="text-align: center; font-size: 14px; color: #475569; margin-top: 2px;">
      Don't have an account? <span style="font-weight: 700; color: #0052ff;">Sign up</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
