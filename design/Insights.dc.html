<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #0052ff; } a:hover { color: #0041cc; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f8fafc; position: relative; overflow: hidden; color: #0f172a;">

  <div style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: #475569;">Last 7 days</span>
    <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.6px;">Insights</span>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px;">

    <!-- ── Trend ─────────────────────────────────────────── -->
    <div style="background: #ffffff; border-radius: 22px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 26px rgba(15,23,42,0.07);">

      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 800;">Recovery</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" style="width: 14px; height: 14px;" fill="none" stroke="#0f9d58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          <span class="num" style="font-size: 12px; font-weight: 700; color: #0f9d58;">+6 this week</span>
        </div>
      </div>

      <!-- gridlines behind the bars give the numbers somewhere to sit -->
      <div style="position: relative; height: 176px;">
        <div style="position: absolute; inset: 0 0 22px 0; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="height: 1px; background: #f1f5f9;"></div>
          <div style="height: 1px; background: #f1f5f9;"></div>
          <div style="height: 1px; background: #f1f5f9;"></div>
          <div style="height: 1px; background: #e2e8f0;"></div>
        </div>

        <div style="position: relative; height: 100%; display: flex; align-items: flex-end; gap: 9px;">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
              <span class="num" style="font-size: 11px; font-weight: 700; color: {{d.valueColor}};">{{d.score}}</span>
              <div style="width: 100%; border-radius: 8px 8px 4px 4px; background: {{d.fill}}; height: {{d.height}};"></div>
              <span style="font-size: 10px; color: {{d.dayColor}}; height: 12px;">{{d.day}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; gap: 16px; padding-top: 2px; border-top: 1px solid #f1f5f9;">
        <div style="display: flex; align-items: center; gap: 6px; padding-top: 10px;">
          <span style="width: 10px; height: 4px; border-radius: 999px; background: #0052ff;"></span>
          <span style="font-size: 11px; color: #475569;">Established</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding-top: 10px;">
          <span style="width: 10px; height: 4px; border-radius: 999px; background: #8b5cf6;"></span>
          <span style="font-size: 11px; color: #475569;">Provisional — building your baseline</span>
        </div>
      </div>
    </div>

    <!-- ── Summary stats ─────────────────────────────────── -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="background: #ffffff; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 20px rgba(15,23,42,0.06);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #0052ff1a; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" style="width: 15px; height: 15px;" fill="none" stroke="#0052ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </span>
          <span style="font-size: 11px; color: #475569;">Average</span>
        </div>
        <span class="num" style="font-size: 26px; font-weight: 800;">71</span>
        <span style="font-size: 10px; color: #475569;">across 7 scored days</span>
      </div>

      <div style="background: #ffffff; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 20px rgba(15,23,42,0.06);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #0083b01a; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" style="width: 15px; height: 15px;" fill="none" stroke="#0083b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </span>
          <span style="font-size: 11px; color: #475569;">Recorded</span>
        </div>
        <span class="num" style="font-size: 26px; font-weight: 800;">7<span style="font-size: 16px; color: #475569;">/7</span></span>
        <span style="font-size: 10px; color: #475569;">nights with sleep data</span>
      </div>
    </div>

    <!-- ── Sleep vs recovery, the relationship worth showing ── -->
    <div style="background: #ffffff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 26px rgba(15,23,42,0.07);">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 800;">Sleep this week</span>
        <span class="num" style="font-size: 13px; font-weight: 700; color: #475569;">7h 48m avg</span>
      </div>

      <div style="display: flex; align-items: flex-end; gap: 9px; height: 62px;">
        <sc-for list="{{sleep}}" as="s" hint-placeholder-count="7">
          <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%;">
            <div style="width: 100%; border-radius: 4px 4px 0 0; background: #0052ff; height: {{s.deep}};"></div>
            <div style="width: 100%; background: #8b5cf6; height: {{s.rem}};"></div>
            <div style="width: 100%; border-radius: 0 0 4px 4px; background: #e2e8f0; height: {{s.light}};"></div>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #f8fafc;">
        <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; flex-shrink: 0;" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span style="font-size: 11px; line-height: 16px; color: #475569;">Tuesday's resting heart rate ran <span style="color: #0f172a; font-weight: 600;">4 bpm above</span> your baseline.</span>
      </div>
    </div>
  </div>

  <!-- ── Nav ──────────────────────────────────────────────── -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 66px; background: #ffffff; border-radius: 26px; box-shadow: 0 10px 34px rgba(15,23,42,0.15), 0 2px 8px rgba(15,23,42,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
    <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="width: 38px; height: 26px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px;" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </span>
      <span style="font-size: 9.5px; font-weight: 500; color: #94a3b8;">Today</span>
    </div>
    <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="width: 38px; height: 26px; border-radius: 9px; background: #0052ff14; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px;" fill="none" stroke="#0052ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
      </span>
      <span style="font-size: 9.5px; font-weight: 700; color: #0052ff;">Insights</span>
    </div>
    <div style="width: 62px; display: flex; justify-content: center;">
      <div style="width: 56px; height: 56px; margin-top: -30px; border-radius: 20px; background: linear-gradient(135deg, #0052ff 0%, #00b4db 100%); box-shadow: 0 12px 26px rgba(0,82,255,0.42); display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px;" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </div>
    <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="width: 38px; height: 26px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px;" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect><line x1="9" y1="1.5" x2="9" y2="4"></line><line x1="15" y1="1.5" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="22.5"></line><line x1="15" y1="20" x2="15" y2="22.5"></line><line x1="20" y1="9" x2="22.5" y2="9"></line><line x1="20" y1="15" x2="22.5" y2="15"></line><line x1="1.5" y1="9" x2="4" y2="9"></line><line x1="1.5" y1="15" x2="4" y2="15"></line></svg>
      </span>
      <span style="font-size: 9.5px; font-weight: 500; color: #94a3b8;">Device</span>
    </div>
    <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="width: 38px; height: 26px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px;" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </span>
      <span style="font-size: 9.5px; font-weight: 500; color: #94a3b8;">Profile</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const week = [
      { day: 'Fri', score: 64, provisional: false },
      { day: 'Sat', score: 72, provisional: false },
      { day: 'Sun', score: 78, provisional: false },
      { day: 'Mon', score: 69, provisional: true },
      { day: 'Tue', score: 61, provisional: false },
      { day: 'Wed', score: 74, provisional: false },
      { day: 'Thu', score: 75, provisional: false },
    ];

    const CHART = 130;

    const sleepWeek = [
      { deep: 82, rem: 104, total: 452 },
      { deep: 96, rem: 118, total: 508 },
      { deep: 104, rem: 126, total: 531 },
      { deep: 71, rem: 96, total: 398 },
      { deep: 66, rem: 88, total: 372 },
      { deep: 91, rem: 112, total: 486 },
      { deep: 87, rem: 112, total: 560 },
    ];
    const tallest = Math.max(...sleepWeek.map((s) => s.total));

    return {
      days: week.map((d, i) => ({
        ...d,
        height: `${Math.round((d.score / 100) * CHART)}px`,
        // Provisional is a different kind of reading, not a worse one — so it gets its
        // own hue rather than a muted version of the confident one.
        fill: d.provisional ? '#8b5cf6' : (i === week.length - 1 ? '#0052ff' : '#93c5fd'),
        valueColor: i === week.length - 1 ? '#0f172a' : '#475569',
        dayColor: i === week.length - 1 ? '#0f172a' : '#475569',
      })),
      sleep: sleepWeek.map((s) => {
        const scale = 62 / tallest;
        const light = Math.max(s.total - s.deep - s.rem, 0);
        return {
          deep: `${Math.round(s.deep * scale)}px`,
          rem: `${Math.round(s.rem * scale)}px`,
          light: `${Math.round(light * scale)}px`,
        };
      }),
    };
  }
}
</script>
</body>
</html>
